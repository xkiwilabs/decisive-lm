# Choice prompt for labeller method (a) and P0 with more options than MAX_LETTERED (decisivelm/synth/label.py): the
# options are numbered 01, 02, … and the label is read one digit at a time (per-option scoring, SPEC §4.3a). Thinking
# off; the assistant turn is pre-filled with `prefill` (ending in a space), so the next token is the first digit.
# The state comes last so everything before it is shared across items and cached.
system: |-
  You answer one multiple-choice question about a state. Read the question and the options, then the state, and choose the single option that best fits. Reply with the option's number only, as written.
user: |-
  Question:
  {instructions}

  Options:
  {options}

  State:
  {state}
prefill: "Answer: "
