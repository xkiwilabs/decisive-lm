    reference: data/predictions/P3_helpsteer2_e4b_z_r8_seed0.jsonl
  civil_comments:
    data: data/processed/civil_comments.jsonl
    reference: data/predictions/P3_civil_comments_e4b_z_r8_seed0.jsonl
  goemotions:
    data: data/processed/goemotions.jsonl
    reference: data/predictions/P3_goemotions_e4b_r8_seed0.jsonl
  ledgar:
    data: data/processed/ledgar.jsonl
