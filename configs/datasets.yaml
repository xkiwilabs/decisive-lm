# Expected licence and tier per source (docs/guide/14 §14.1).
# `license` is an SPDX id (LicenseRef-* for anything without one). The tier is
# derived from it: R permissive, S share-alike, X everything else. A source may
# be put in a more restrictive tier with an `override` reason, never a less
# restrictive one. decisivelm/data/dataset.py refuses rows that disagree.
version: 1
datasets:
  llm_response_coding:
    description: Free-text "what is this person's intent?" responses to action videos, coded by four humans (the authors' coding study)
    source: The authors' study data (not distributed), imported by column whitelist
    license: LicenseRef-pending
    tier: X
    override: >-
      Ethics-approved, non-identifiable and cleared for public release, but no licence has been chosen yet.
      X tier (private experiments and eval only) until it is; CC-BY-4.0 or CC0-1.0 would make it R.

  # Seed datasets (docs/guide/14 §14.2). `fetch` pins every file to a commit or Hub revision;
  # scripts/fetch_dataset.py downloads them into data/raw/<name>/ and records sha256s.
  banking77:
    description: 13,083 online-banking customer queries labelled with 77 fine-grained intents
    source: https://github.com/PolyAI-LDN/task-specific-datasets (Casanueva et al. 2020)
    license: CC-BY-4.0
    tier: R
    fetch:
      - url: https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/57ec275d8078af65b7731c2a98be812d844a6d6b/banking_data/train.csv
        file: train.csv
      - url: https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/57ec275d8078af65b7731c2a98be812d844a6d6b/banking_data/test.csv
        file: test.csv

  clinc150:
    description: CLINC150 "plus" — 150 virtual-assistant intents across 10 domains plus out-of-scope queries
    source: https://huggingface.co/datasets/clinc/clinc_oos (Larson et al. 2019)
    license: CC-BY-3.0
    tier: R
    fetch:
      - {hf: clinc/clinc_oos, revision: 155b9c710419136e17307b80d0a13e68cd46b4ec, path: plus/train-00000-of-00001.parquet, file: train.parquet}
      - {hf: clinc/clinc_oos, revision: 155b9c710419136e17307b80d0a13e68cd46b4ec, path: plus/validation-00000-of-00001.parquet, file: validation.parquet}
      - {hf: clinc/clinc_oos, revision: 155b9c710419136e17307b80d0a13e68cd46b4ec, path: plus/test-00000-of-00001.parquet, file: test.parquet}
      - {hf: clinc/clinc_oos, revision: 155b9c710419136e17307b80d0a13e68cd46b4ec, path: README.md, file: README.md}

  # Generated (docs/guide/13 §13.4): questions and states written by the teacher on a vLLM server (scripts/synth_generate.py).
  # Gemma 4 is Apache-2.0 and places no terms on its outputs. Fan-out rows on real states keep their parent's source,
  # licence and tier instead.
  synth_gemma4:
    description: Question sets and states written by Gemma 4 26B A4B to seeded specs (domains, types, option counts, styles)
    source: Generated locally by scripts/synth_generate.py (prompts in decisivelm/synth/prompts/generate_v1.yaml)
    license: Apache-2.0
    tier: R

  helpsteer2:
    description: NVIDIA HelpSteer2 — prompt/response pairs rated 0–4 on helpfulness, correctness, coherence, complexity and verbosity
    source: https://huggingface.co/datasets/nvidia/HelpSteer2 (Wang et al. 2024)
    license: CC-BY-4.0
    tier: R
    fetch:
      - {hf: nvidia/HelpSteer2, revision: 990b2711a36180dd19d9c94b8627844866f8982a, path: train.jsonl.gz, file: train.jsonl.gz}
      - {hf: nvidia/HelpSteer2, revision: 990b2711a36180dd19d9c94b8627844866f8982a, path: validation.jsonl.gz, file: validation.jsonl.gz}
      - {hf: nvidia/HelpSteer2, revision: 990b2711a36180dd19d9c94b8627844866f8982a, path: disagreements/disagreements.jsonl.gz, file: disagreements.jsonl.gz}
      - {hf: nvidia/HelpSteer2, revision: 990b2711a36180dd19d9c94b8627844866f8982a, path: README.md, file: README.md}

  helpsteer2_preference:
    description: HelpSteer2-Preference — two responses to one prompt, which is better and by how much (−3 to +3), rated by 3–5 annotators each
    source: https://huggingface.co/datasets/nvidia/HelpSteer2 (Wang et al. 2025, HelpSteer2-Preference)
    license: CC-BY-4.0
    tier: R
    note: >-
      The same task as the suite's HelpSteer3, deferred until the first release (docs/RELEASE.md, suite-task rule);
      from 0.2, HelpSteer3 is reported as a seen task. Its prompts and responses are HelpSteer2's, so rows take
      HelpSteer2's split and family by prompt.
    fetch:
      - {hf: nvidia/HelpSteer2, revision: 990b2711a36180dd19d9c94b8627844866f8982a, path: preference/preference.jsonl.gz, file: preference.jsonl.gz}

  koniq10k:
    description: KonIQ-10k — 10,073 photos, each rated for technical quality on a 5-point scale (bad … excellent) by about 120 crowd workers
    source: https://database.mmsp-kn.de/koniq-10k-database.html (Hosu, Lin, Sziranyi & Saupe 2020)
    license: NOASSERTION
    tier: X
    override: >-
      No licence is stated; the page says the database is "freely available to the research community", and the photos
      are Flickr images under their own licences. Image fine-tune examples only, never a released head.
    note: >-
      Images from the authors' OSF mirror (osf.io/hcsdy), which lists each file's sha256 (the project site was not
      responding); the rating counts from the authors' code repository (subpic/koniq, MIT), pinned to a commit.
      The 1024x768 images (the size raters saw) come as a split zip, joined with `zip -s 0` by the converter.
    fetch:
      - url: https://raw.githubusercontent.com/subpic/koniq/1c271570ac83aeb6aa8e7ff25449f3299b0d2e53/metadata/koniq10k_distributions_sets.csv
        file: koniq10k_distributions_sets.csv   # per-image counts of each rating and the authors' split (repo: MIT)
      - url: https://osf.io/download/cmuak/
        file: 1024x768.zip
        sha256: ca3104f07fc451e47bf36908e2a286363c0b625e54f005b2f943a9af36f91402
      - url: https://osf.io/download/byser/
        file: 1024x768.z01
        sha256: 98a40ecd6ad8c35ee206ded7aa03c4db6232ceaef888e6d4bab2f2650e3a876d

  crema_d:
    description: CREMA-D — 7,442 clips of 91 actors saying 12 sentences in six emotions; each clip's emotion and intensity judged by about 10 listeners from the voice alone
    source: https://github.com/CheyneyComputerScience/CREMA-D (Cao et al. 2014)
    license: ODbL-1.0
    tier: S
    note: >-
      Open Database License, contents under the Database Contents License. Acted emotion, as listeners perceive it:
      used for audio fine-tune examples. The actors' demographics file is never read.
    fetch:
      - {url: "https://raw.githubusercontent.com/CheyneyComputerScience/CREMA-D/1658cd342dff90010aa843eaeebd53610a08b1dc/finishedResponses.csv", file: finishedResponses.csv}
      - {url: "https://raw.githubusercontent.com/CheyneyComputerScience/CREMA-D/1658cd342dff90010aa843eaeebd53610a08b1dc/processedResults/tabulatedVotes.csv", file: tabulatedVotes.csv}
      - {github: CheyneyComputerScience/CREMA-D, revision: 1658cd342dff90010aa843eaeebd53610a08b1dc, allow: "AudioWAV/*.wav"}

  things_living:
    description: THINGSplus — one public-domain photo for each of 1,854 object concepts, and about 37 online raters per concept judging "something that lives" on a 7-point agreement scale
    source: https://osf.io/jum2f/ (Hebart et al. 2019; Stoinski, Perkuhn & Hebart 2024)
    license: CC-BY-4.0
    tier: R
    note: >-
      Ratings and metadata CC BY 4.0 (credit the two papers); the THINGSplus photos CC0. Only the CC0 photos are used,
      never the password-protected THINGS image set (research use only, no redistribution or modification). Raters
      saw the object's name and a photo of it. The raters' age and gender columns are never read. The OSF download
      links are not pinned to a version, so each file's content is pinned.
    fetch:
      - {url: "https://osf.io/download/wb36u/", file: images_THINGSplus-CC0.zip, sha256: ed86912f6848ac5cf8b405a727f875295cc081cdd64271e80ae4d607b7d447e3}
      - {url: "https://osf.io/download/7y38s/", file: object-properties_trial-wise_thingsplus.tsv, sha256: a5172712c564ef060c20d18eace69e99d7aa3d798e81b7b628f63e1da7a4f05f}
      - {url: "https://osf.io/download/52wrx/", file: LICENSE, sha256: de570769b5545d7b9a7f9165b9da691370fa680330a8b2bf73cd9368ba1dbc97}

  civil_comments:
    description: Civil Comments (Jigsaw) — public comments with the share of raters marking each toxicity attribute
    source: https://huggingface.co/datasets/google/civil_comments (Borkan et al. 2019)
    license: CC0-1.0
    tier: R
    fetch:
      - {hf: google/civil_comments, revision: f2970eb3a55777454c94069077cc8d9b5866312d, path: data/train-00000-of-00002.parquet, file: train-0.parquet}
      - {hf: google/civil_comments, revision: f2970eb3a55777454c94069077cc8d9b5866312d, path: data/train-00001-of-00002.parquet, file: train-1.parquet}
      - {hf: google/civil_comments, revision: f2970eb3a55777454c94069077cc8d9b5866312d, path: data/validation-00000-of-00001.parquet, file: validation.parquet}
      - {hf: google/civil_comments, revision: f2970eb3a55777454c94069077cc8d9b5866312d, path: data/test-00000-of-00001.parquet, file: test.parquet}

  goemotions:
    description: GoEmotions — 58k Reddit comments, each rated by 3–5 raters for 27 emotions plus neutral
    source: https://huggingface.co/datasets/google-research-datasets/go_emotions (Demszky et al. 2020)
    license: Apache-2.0
    tier: R
    fetch:
      - {hf: google-research-datasets/go_emotions, revision: add492243ff905527e67aeb8b80c082af02207c3, path: raw/train-00000-of-00001.parquet, file: raw.parquet}
      - {hf: google-research-datasets/go_emotions, revision: add492243ff905527e67aeb8b80c082af02207c3, path: simplified/train-00000-of-00001.parquet, file: simplified_train.parquet}
      - {hf: google-research-datasets/go_emotions, revision: add492243ff905527e67aeb8b80c082af02207c3, path: simplified/validation-00000-of-00001.parquet, file: simplified_validation.parquet}
      - {hf: google-research-datasets/go_emotions, revision: add492243ff905527e67aeb8b80c082af02207c3, path: simplified/test-00000-of-00001.parquet, file: simplified_test.parquet}
      - {hf: google-research-datasets/go_emotions, revision: add492243ff905527e67aeb8b80c082af02207c3, path: README.md, file: README.md}

  ledgar:
    description: LEDGAR (LexGLUE) — 80k contract provisions from SEC filings, each labelled with one of 100 provision types
    source: https://huggingface.co/datasets/coastalcph/lex_glue (Tuggener et al. 2020; Chalkidis et al. 2022)
    license: CC-BY-4.0
    tier: R
    note: Licence as distributed in LexGLUE (dataset card metadata); the provisions are public SEC EDGAR filings.
    fetch:
      - {hf: coastalcph/lex_glue, revision: c23fdff1a6bf74e0e1a71cb86f1e781d37da888c, path: ledgar/train-00000-of-00001.parquet, file: train.parquet}
      - {hf: coastalcph/lex_glue, revision: c23fdff1a6bf74e0e1a71cb86f1e781d37da888c, path: ledgar/validation-00000-of-00001.parquet, file: validation.parquet}
      - {hf: coastalcph/lex_glue, revision: c23fdff1a6bf74e0e1a71cb86f1e781d37da888c, path: ledgar/test-00000-of-00001.parquet, file: test.parquet}
      - {hf: coastalcph/lex_glue, revision: c23fdff1a6bf74e0e1a71cb86f1e781d37da888c, path: README.md, file: README.md}

  multinli:
    description: MultiNLI 1.0 without the fiction genre — premise/hypothesis pairs labelled entailment, neutral or contradiction; dev pairs by 5 annotators
    source: https://cims.nyu.edu/~sbowman/multinli/ (Williams et al. 2018)
    license: LicenseRef-OANC
    tier: R
    note: >-
      The non-fiction genres come from the Open American National Corpus, free of restrictions on use and
      redistribution; the fiction genre mixes CC BY-SA 3.0 and other works, so the converter drops it. Served from a
      university page rather than a commit, so the archive is pinned by sha256.
    fetch:
      - url: https://cims.nyu.edu/~sbowman/multinli/multinli_1.0.zip
        file: multinli_1.0.zip
        sha256: 049f507b9e36b1fcb756cfd5aeb3b7a0cfcb84bf023793652987f7e7e0957822

  sib200:
    description: SIB-200 — 1,004 Flores-200 news sentences labelled with one of 7 topics, the same sentences in 205 languages
    source: https://huggingface.co/datasets/Davlan/sib200 (Adelani et al. 2024)
    license: CC-BY-SA-4.0
    tier: S
    note: >-
      A development check of calibration on text that is not English, on languages outside the suite's held-out ten
      (docs/RELEASE.md, change log 2026-10-24: no non-English scale is fitted). Share-alike, so it is never trained on
      for the general adapter.
    fetch:
      - {hf: Davlan/sib200, revision: 38977a667f6fc264d5c26ec57a01e16db040b358, allow: "data/*/*", file: data}
      - {hf: Davlan/sib200, revision: 38977a667f6fc264d5c26ec57a01e16db040b358, path: README.md, file: README.md}

  politeness:
    description: Stanford Politeness Corpus, Stack Exchange part — 6,603 requests, each rated by 5 crowd workers on a 1–25 slider from very impolite to very polite
    source: https://convokit.cornell.edu/documentation/stack_politeness.html (Danescu-Niculescu-Mizil et al. 2013; ConvoKit release)
    license: CC-BY-SA-3.0
    tier: S
    note: >-
      Human-rated training data for a two-sided Score with a common neutral middle (docs/RELEASE.md, change log
      2026-10-25). Tier S: the requests are Stack Exchange posts, which are CC BY-SA 3.0; ConvoKit's CC BY 4.0
      covers its release, not the posts' text. ConvoKit serves the corpus from a university server, so the archive is pinned by sha256; the
      per-rater ratings are a pickle of numpy integers, read by an unpickler that refuses anything else. The
      Wikipedia part is not used.
    fetch:
      - url: https://zissou.infosci.cornell.edu/convokit/datasets/stack-exchange-politeness-corpus/stack-exchange-politeness-corpus.zip
        file: stack-exchange-politeness-corpus.zip
        sha256: d5be7586c3f4224cffdb45cf87af17b5ad17c0ed4d2d5f6560bcb201703681a3

  humicroedit:
