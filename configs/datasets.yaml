      - {hf: cardiffnlp/tweet_topic_single, revision: 87b7a0d1c402dbb481db649569c556d9aa27ac05, path: README.md, file: README.md}
  bench_fin_topic:
    description: zeroshot/twitter-financial-news-topic validation split (4,117 tweets, 20 topics), as evaluated by elcronos/jev-vs-open-decision-models
    source: https://huggingface.co/datasets/zeroshot/twitter-financial-news-topic; harness github.com/elcronos/jev-vs-open-decision-models
