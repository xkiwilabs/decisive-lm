    source: https://zenodo.org/records/3969509 (Hossain et al. 2020)
    license: CC-BY-4.0
    tier: R
    note: >-
      Human ratings with several raters per item from a judgement unrelated to the suite's tasks (docs/RELEASE.md,
      change log 2026-10-26). The licence is stated on the Zenodo record (the Hugging Face copy says "unknown").
      Zenodo's md5 is 9953e94c4dc7e50d68b010d68a143f9c.
    fetch:
      - url: https://zenodo.org/records/3969509/files/semeval-2020-task-7-dataset.zip?download=1
        file: semeval-2020-task-7-dataset.zip
        sha256: 12a6cbf28c8b698ad80be42a65ac867b57e4c71662eedab607805e167ba791ab

  csc_sarcasm:
    description: Conversational Sarcasm Corpus — 7,036 replies to everyday scenarios, each rated 1–6 for sarcasm by 4 or 6 other people
    source: https://github.com/hyewon-jang-kn/conversational-sarcasm-corpus (Jang & Frassinelli 2024)
    license: MIT
    tier: R
    note: >-
      Human ratings with several raters per item from a judgement unrelated to the suite's tasks (docs/RELEASE.md,
      change log 2026-10-26). The repository's LICENSE is MIT; the corpus is also in LeWiDi 2025.
    fetch:
      - url: https://raw.githubusercontent.com/hyewon-jang-kn/conversational-sarcasm-corpus/bd0a2894c381fffdb5bf0ec8d5cfaa812cac94d8/data_full.csv
        file: data_full.csv
        sha256: fd8ca7531887823a315e91f5d0edbcc9ec685a557c333c37f485a15a9e55ad7a

  args_me:
    description: args.me corpus 1.0 (cleaned) — 382,545 arguments from four debate portals (Debatewise, IDebate.org, Debatepedia, Debate.org), each with its debate's title and a stance
    source: https://zenodo.org/records/4139439 (Ajjour et al. 2019)
    license: CC-BY-4.0
    tier: R
    note: >-
      Texts for the rating app's two-sided Scores (docs/RELEASE.md, change log 2026-10-27); no labels of its own are
      used. Zenodo says "individual rights to the content still apply". The archive is one 888 MB JSON object once
      unzipped; it is read from the zip. Zenodo's md5 is fb0837103a4860e1d4536174f55b12c3.
    fetch:
      - url: https://zenodo.org/records/4139439/files/argsme-1.0-cleaned.zip?download=1
        file: argsme-1.0-cleaned.zip
        sha256: da8f680603d072489372e95cadd0308d576850a70fb36707893e3c6af7fe3033

  wiki_toxicity:
    description: Wikipedia Talk Labels, Toxicity — 159,686 English Wikipedia talk-page comments, each rated by about 10 crowd workers from very toxic to very healthy (5 levels)
    source: https://figshare.com/articles/Wikipedia_Talk_Labels_Toxicity/4563973 (Wulczyn et al. 2017, Wikimedia and Jigsaw)
    license: CC0-1.0
    tier: R
    note: >-
      A development check of review readiness on a social-judgement Score rated by many people (docs/RELEASE.md,
      change log 2026-10-25): never trained on for the general adapter (configs/holdout.yaml). Served by figshare,
      so each file is pinned by sha256 (figshare's md5s match).
    fetch:
      - url: https://ndownloader.figshare.com/files/7394539
        file: toxicity_annotations.tsv
        sha256: ebef1ada7564f465cdb53bfbbe4789c2c185a662404860972ba3a9db097e3397
      - url: https://ndownloader.figshare.com/files/7394542
        file: toxicity_annotated_comments.tsv
        sha256: a4327cef5932459852599f281a4f3908f50d98117608f0c1473aa989e2bcf362

  maud:
    description: MAUD v1 — deal-point questions on 152 public merger agreements, answered by law students and checked by experienced M&A lawyers (Wang et al. 2023)
    source: https://huggingface.co/datasets/theatticusproject/maud (The Atticus Project)
    license: CC-BY-4.0
    tier: R
    fetch:
      - {hf: theatticusproject/maud, revision: 37d5c3b95d18dcd8404cc5ce3fd5069be062392f, path: MAUD_v1/MAUD_train.csv, file: train.csv}
      - {hf: theatticusproject/maud, revision: 37d5c3b95d18dcd8404cc5ce3fd5069be062392f, path: MAUD_v1/MAUD_dev.csv, file: dev.csv}
