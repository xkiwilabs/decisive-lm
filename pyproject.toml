[project]
name = "decisive-lm"
version = "0.0.1"
description = "Local, multimodal System One decision model on Gemma 4"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Michael J. Richardson" }]
keywords = ["decision model", "calibration", "human disagreement", "review readiness", "gemma", "lora"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.14",
    # Pinned: tree masks depend on Gemma 4's mask-mapping and KV-sharing internals (docs/guide/06 §6.3, results/M0.md).
    "transformers==5.18.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "pillow>=12.3.0",
    "numpy>=2.5.3",
    "torchvision>=0.29.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "accelerate>=1.15.0",
]

[project.urls]
Homepage = "https://github.com/xkiwilabs/decisive-lm"
Documentation = "https://github.com/xkiwilabs/decisive-lm/tree/main/docs/guide"
Issues = "https://github.com/xkiwilabs/decisive-lm/issues"
"Hugging Face" = "https://huggingface.co/xkiwilabs"

[project.optional-dependencies]
audio = [
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decisivelm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["real_model: needs downloaded Gemma 4 weights; skipped in CI"]
addopts = "-m 'not real_model'"
